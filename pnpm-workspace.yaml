packages:
  - "apps/*"
  - "packages/*"
overrides:
  lodash: ^4.18.1
  postcss: ^8.5.25
  sharp: ^0.35.5
  # Blanket, not scoped to @nestjs/swagger: the other js-yaml consumer in
  # the tree (@istanbuljs/load-nyc-config, via jest's coverage tooling)
  # only calls the shared `.load()` API, which exists unchanged on both the
  # v3 and v4 lines, so collapsing it onto v4 here is safe and closes the
  # v3.15.1 CVE too instead of leaving a second unpatched copy in the graph.
  js-yaml: ^4.3.2
  hono: ^4.13.5
  fast-uri: ^3.1.9
  qs: ^6.16.1
  multer: ^2.5.0
  nanoid: ^3.3.17
  deepmerge-ts: ^8.0.0
  undici: ^7.30.1
  ip-address: ^10.7.4
  handlebars: ^4.7.10
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
  postcss-selector-parser: ^7.1.6
  uuid: ^11.1.1
  zod: ^4.6.6
  body-parser: ^2.4.0
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true
  usb: true
minimumReleaseAgeExclude:
  - brace-expansion@1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.10 || 5.0.11 || 5.0.12
  - engine.io@6.6.10
